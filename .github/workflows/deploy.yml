name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - "*.html"
      - "projects/**"
      - "assets/**"
      - "robots.txt"
      - "sitemap.xml"
      - "CNAME"
      - ".nojekyll"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Assemble static site 📦
        run: |
          mkdir -p dist
          cp index.html 404.html robots.txt sitemap.xml CNAME .nojekyll dist/
          cp -r assets projects dist/

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
